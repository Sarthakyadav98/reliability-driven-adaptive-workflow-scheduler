[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdas"
version = "0.1.0"
description = "Reliability-Driven Adaptive Workflow Scheduling with Hybrid Quantum-Classical Optimization (BTP, IIIT Kottayam)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "dimod>=0.12",
    "dwave-samplers>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rdas-experiment = "rdas.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdas = ["viewer_template.html", "studio.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
